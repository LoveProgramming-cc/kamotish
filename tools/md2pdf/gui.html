<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>卡谋语 MD 转 PDF</title>
<style>
:root { --bg: #f5f4f0; --panel: #fff; --line: #ddd9cf; --text: #1d1d1b; --muted: #77736a; --accent: #1e3a48; --warn: #b3261e; --ok: #2e7d32; }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; overflow: hidden; }
body { font: 14px/1.5 -apple-system, "PingFang SC", sans-serif; color: var(--text); background: var(--bg); display: grid;
       grid-template-rows: auto minmax(0, 1fr); grid-template-columns: 340px minmax(0, 1fr); }
header { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 14px; align-items: center; padding: 10px 16px;
         background: var(--accent); color: #fff; }
header h1 { font-size: 16px; margin: 0 12px 0 0; font-weight: 600; }
header label { display: flex; gap: 6px; align-items: center; font-size: 13px; }
header select, header input { font: inherit; padding: 3px 6px; border-radius: 5px; border: 1px solid #ffffff55; background: #ffffff18; color: #fff; }
header select option { color: #000; }
header input[type=text] { width: 300px; }
header input::placeholder { color: #ffffffaa; }
aside { border-right: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
#drop { margin: 12px; padding: 16px; border: 2px dashed var(--line); border-radius: 10px; text-align: center; color: var(--muted); }
#drop.over { border-color: var(--accent); background: #eef3f5; }
.row { display: flex; gap: 6px; margin-top: 8px; justify-content: center; flex-wrap: wrap; }
button { font: inherit; padding: 4px 10px; border-radius: 6px; border: 1px solid var(--line); background: #fff; cursor: pointer; }
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button:disabled { opacity: .5; cursor: default; }
#pathrow { display: flex; gap: 6px; margin: 0 12px 8px; }
#pathrow input { flex: 1; font: inherit; padding: 4px 6px; border: 1px solid var(--line); border-radius: 6px; min-width: 0; }
#bar { display: flex; justify-content: space-between; align-items: center; padding: 6px 12px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); color: var(--muted); }
#list { list-style: none; margin: 0; padding: 0; overflow: auto; flex: 1; }
#list li { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid #eee; cursor: pointer; }
#list li.sel { background: #e7eef1; }
#list .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.badge { font-size: 12px; padding: 0 6px; border-radius: 9px; white-space: nowrap; }
.badge.warn { background: #fde7e5; color: var(--warn); }
.badge.ok { background: #e6f2e7; color: var(--ok); }
.badge.busy { background: #eee; color: var(--muted); }
main { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
#docbar { display: none; align-items: center; gap: 8px; padding: 6px 12px; border-bottom: 1px solid var(--line); background: var(--panel); }
#docbar .title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
#docbar button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.dirty { color: #d97706; }
#problems { display: none; padding: 6px 12px; background: #fdf1ef; border-bottom: 1px solid #f2c9c4; color: var(--warn); max-height: 150px; overflow: auto; font-size: 13px; }
#problems .p { display: flex; gap: 10px; align-items: baseline; padding: 2px 6px; border-radius: 5px; cursor: pointer; }
#problems .p:hover { background: #fbe0dc; }
#problems .ln { color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
#problems code { font-family: Menlo, monospace; background: #fff; padding: 0 4px; border-radius: 3px; word-break: break-all; }
#work { flex: 1; display: flex; min-height: 0; }
#edwrap { display: none; flex: 1; min-width: 0; border-right: 1px solid var(--line); background: #fff; position: relative; }
#work.editing #edwrap { display: flex; }
#editor, #mirror { flex: 1; border: 0; outline: none; resize: none; padding: 10px 14px; font: 13px/1.7 Menlo, "PingFang SC", monospace; color: var(--text);
          background: #fff; white-space: pre-wrap; overflow-wrap: anywhere; overflow-y: auto; tab-size: 4; }
#mirror { position: absolute; visibility: hidden; left: 0; top: 0; right: 0; height: auto; overflow: hidden; }
#cursorPos { color: var(--muted); font-size: 12px; white-space: nowrap; }
#preview { flex: 1; min-width: 0; border: 0; width: 100%; background: #fff; }
#empty { margin: auto; color: var(--muted); text-align: center; }
#log { padding: 6px 16px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); background: var(--panel); min-height: 28px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 760px) { body { grid-template-columns: 1fr; grid-template-rows: auto auto 1fr; } aside { max-height: 45vh; } header input[type=text] { width: 100%; } }
</style>
</head>
<body data-kamotish="off">
<header>
  <h1>卡谋语 Markdown → PDF</h1>
  <label>纸张 <select id="paper"><option>A4</option><option>A5</option><option>B5</option><option>Letter</option></select></label>
  <label>字号 <select id="size"><option>10</option><option selected>11</option><option>12</option><option>14</option></select> pt</label>
  <label><input type="checkbox" id="pagenum" checked> 页码</label>
  <label>保存到 <input type="text" id="saveTo" placeholder="留空 = 浏览器下载；或填文件夹完整路径"></label>
</header>
<aside>
  <div id="drop">把 .md 文件或文件夹拖到这里
    <div class="row">
      <button id="pickFiles">选择文件</button>
      <button id="pickDir">选择文件夹</button>
    </div>
    <input type="file" id="files" accept=".md,.markdown,text/markdown" multiple hidden>
    <input type="file" id="dir" webkitdirectory hidden>
  </div>
  <div id="pathrow"><input id="dirPath" placeholder="或输入本机文件夹路径 (图片可显示)"><button id="loadPath">载入</button></div>
  <div id="bar"><span id="count">0 个文件</span><span><button id="clear">清空</button> <button id="all" class="primary" disabled>全部导出</button></span></div>
  <ul id="list"></ul>
</aside>
<main>
  <div id="docbar">
    <span class="title" id="docTitle"></span>
    <span id="cursorPos"></span>
    <button id="editBtn" title="打开源码编辑 (左源码、右预览)">编辑</button>
    <button id="saveBtn" disabled>保存</button>
  </div>
  <div id="problems"></div>
  <div id="empty">左边加入 Markdown 文件，这里显示预览。<br>数学公式写 <code>$…$</code> / <code>$$…$$</code>，卡谋语写 <code>\kamotish{…}</code>。</div>
  <div id="work" hidden>
    <div id="edwrap"><textarea id="editor" spellcheck="false"></textarea><div id="mirror" aria-hidden="true"></div></div>
    <iframe id="preview" title="预览"></iframe>
  </div>
  <div id="log"></div>
</main>
<script>
'use strict';
const $ = id => document.getElementById(id);
const docs = [];          // {name, md, saved (text on disk), dir?, problems?, status?}
const isDirty = d => d.saved !== undefined && d.md !== d.saved;
let current = null;
const CN = { 一: 1, 二: 2, 三: 3, 四: 4, 五: 5, 六: 6, 七: 7, 八: 8, 九: 9, 十: 10 };
const sortKey = n => n.replace(/[一二三四五六七八九十]+/g, m => String(m.length === 1 ? CN[m] : m === '十' ? 10 : (m[0] === '十' ? 10 + CN[m[1]] : CN[m[0]] * 10 + (CN[m[2]] || 0))).padStart(3, '0'));
const byName = (a, b) => sortKey(a).localeCompare(sortKey(b), 'zh', { numeric: true });

const opts = () => ({ paper: $('paper').value, fontSize: Number($('size').value), pageNumbers: $('pagenum').checked, saveTo: $('saveTo').value.trim() });
const log = t => { $('log').textContent = t; };
try { $('saveTo').value = localStorage.getItem('kamo.saveTo') || ''; $('paper').value = localStorage.getItem('kamo.paper') || 'A4'; $('size').value = localStorage.getItem('kamo.size') || '11'; } catch (e) {}
['saveTo', 'paper', 'size'].forEach(k => $(k).addEventListener('change', () => { try { localStorage.setItem('kamo.' + k, $(k).value); } catch (e) {} if (current && k !== 'saveTo') render(true); }));

async function api(path, body) {
  const r = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  if (!r.ok) { let m = r.statusText; try { m = (await r.json()).error || m; } catch (e) {} throw new Error(m); }
  return r;
}

function add(list) {
  for (const d of list) {
    d.saved = d.md;
    const old = docs.findIndex(x => x.name === d.name && x.dir === d.dir);
    if (old >= 0 && isDirty(docs[old]) && !confirm(d.name + ' 有未保存的修改，重新载入会丢掉这些修改。继续吗？')) continue;
    if (old >= 0 && docs[old] === current) current = d;
    if (old >= 0) docs[old] = d; else docs.push(d);
    check(d);
  }
  draw();
  if (docs.length) show(current || docs[0]);
}
async function check(d) {
  try { const r = await (await api('/api/render', Object.assign({}, d, opts()))).json(); d.problems = r.problems; } catch (e) { d.problems = null; }
  draw();
}

function draw() {
  $('count').textContent = docs.length + ' 个文件';
  $('all').disabled = !docs.length;
  const ul = $('list'); ul.innerHTML = '';
  docs.forEach(d => {
    const li = document.createElement('li'); if (d === current) li.className = 'sel';
    const name = document.createElement('span'); name.className = 'name'; name.textContent = (isDirty(d) ? '● ' : '') + d.name; name.title = (d.dir ? d.dir + '/' : '') + d.name;
    const badge = document.createElement('span'); badge.className = 'badge';
    if (d.status) { badge.textContent = d.status; badge.classList.add(d.status === '已导出' ? 'ok' : d.status.startsWith('失败') ? 'warn' : 'busy'); }
    else if (d.problems && d.problems.length) { badge.textContent = d.problems.length + ' 处无法渲染'; badge.classList.add('warn'); }
    const btn = document.createElement('button'); btn.textContent = 'PDF';
    btn.onclick = e => { e.stopPropagation(); exportOne(d); };
    li.append(name, badge, btn); li.onclick = () => show(d);
    ul.append(li);
  });
}

const esc = t => String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
let renderSeq = 0, keepScroll = null;

let editorDoc = null;                                   // the document whose text is in the editor
async function show(d) {
  const switching = editorDoc !== d; editorDoc = d;
  current = d; draw();
  if (switching) { $('editor').value = d.md; $('editor').scrollTop = 0; cursorPos(); }
  $('docbar').style.display = 'flex'; docbar();
  await render(!switching);
}
// render the current document into the preview (keepPos: stay at the same scroll position)
async function render(keepPos) {
  const d = current, seq = ++renderSeq;
  try {
    const r = await (await api('/api/render', Object.assign({}, d, opts()))).json();
    if (seq !== renderSeq || d !== current) return;                 // a newer render has started
    d.problems = r.problems; draw(); problemsPanel();
    const f = $('preview');
    keepScroll = keepPos && f.contentWindow ? f.contentWindow.scrollY : 0;
    $('empty').hidden = true; $('work').hidden = false; f.srcdoc = r.html;
  } catch (e) { log('预览失败: ' + e.message); }
}
$('preview').onload = () => { const w = $('preview').contentWindow; if (w && keepScroll) w.scrollTo(0, keepScroll); if (pendingLocate) { const p = pendingLocate; pendingLocate = null; flash(p); } };

function problemsPanel() {
  const d = current, p = $('problems');
  if (!d || !d.problems || !d.problems.length) { p.style.display = 'none'; return; }
  p.style.display = 'block';
  p.innerHTML = '<b>' + d.problems.length + ' 处卡谋语无法渲染 (预览中显示为红色)，点击定位并修改:</b>' +
    d.problems.map((q, i) => '<div class="p" data-i="' + i + '"><span class="ln">第 ' + q.line + ' 行</span><code>' + esc(q.content) + '</code></div>').join('');
  p.querySelectorAll('.p').forEach(el => el.onclick = () => locate(d.problems[Number(el.dataset.i)]));
}

// ---- click a problem: open the editor at it, select it, and show it in the preview
let pendingLocate = null;
function locate(q) {
  setEditing(true);
  const ed = $('editor'), lines = ed.value.split('\n');
  let pos = 0; for (let i = 0; i < q.line - 1 && i < lines.length; i++) pos += lines[i].length + 1;
  const at = ed.value.indexOf(q.source, pos), start = at >= 0 ? at : pos + q.column;
  ed.focus({ preventScroll: true }); ed.setSelectionRange(start, start + (at >= 0 ? q.source.length : 0));
  // measure how far down the match is (lines wrap), with an invisible copy of the text
  const m = $('mirror'); m.style.width = ed.clientWidth + 'px';
  m.textContent = ed.value.slice(0, start); const mark = document.createElement('span'); mark.textContent = '|'; m.appendChild(mark);
  ed.scrollTop = Math.max(0, mark.offsetTop - ed.clientHeight / 3);
  cursorPos(); flash(q);
}
function flash(q) {
  const doc = $('preview').contentDocument; if (!doc) return;
  const el = doc.querySelectorAll('.kamotish')[q.index];
  if (!el) { pendingLocate = q; return; }
  const w = $('preview').contentWindow;                     // scroll only the preview, never the page around it
  w.scrollTo(0, Math.max(0, el.getBoundingClientRect().top + w.scrollY - w.innerHeight / 2));
  el.classList.add('kamo-flash'); setTimeout(() => el.classList.remove('kamo-flash'), 1800);
}

// ---- editor
function setEditing(on) {
  $('work').classList.toggle('editing', on); $('editBtn').classList.toggle('on', on); cursorPos();
}
$('editBtn').onclick = () => setEditing(!$('work').classList.contains('editing'));
function cursorPos() {
  const ed = $('editor'), before = ed.value.slice(0, ed.selectionStart);
  $('cursorPos').textContent = $('work').classList.contains('editing') ? '第 ' + (before.split('\n').length) + ' 行' : '';
}
['keyup', 'click', 'focus'].forEach(t => $('editor').addEventListener(t, cursorPos));
let editTimer = 0;
$('editor').addEventListener('input', () => {
  if (!current) return;
  current.md = $('editor').value; current.status = null; draw(); docbar(); cursorPos();
  clearTimeout(editTimer); editTimer = setTimeout(() => render(true), 400);
});
$('editor').addEventListener('keydown', e => {
  if (e.key === 'Tab') { e.preventDefault(); document.execCommand('insertText', false, '    '); }
});

// ---- save
function docbar() {
  const d = current; if (!d) return;
  $('docTitle').innerHTML = (isDirty(d) ? '<span class="dirty">● </span>' : '') + esc(d.name) + (d.dir ? ' <span style="color:var(--muted);font-weight:normal">' + esc(d.dir) + '</span>' : '');
  $('saveBtn').textContent = d.dir ? '保存到原文件' : '下载修改后的 .md';
  $('saveBtn').title = d.dir ? '覆盖 ' + d.dir + '/' + d.name : '这个文件是拖进来或选择的，网页不能直接写回原位置；用路径载入的文件才能直接保存';
  $('saveBtn').disabled = !isDirty(d);
}
async function save() {
  const d = current; if (!d || !isDirty(d)) return;
  if (d.dir) {
    try { const j = await (await api('/api/save', { dir: d.dir, name: d.name, md: d.md })).json(); d.saved = d.md; log('已保存 ' + j.saved); }
    catch (e) { log('保存失败: ' + e.message); }
  } else {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([d.md], { type: 'text/markdown;charset=utf-8' })); a.download = d.name; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 60000);
    d.saved = d.md; log('已下载 ' + d.name + ' (修改后的版本)');
  }
  draw(); docbar();
}
$('saveBtn').onclick = save;
document.addEventListener('keydown', e => { if ((e.metaKey || e.ctrlKey) && e.key === 's') { e.preventDefault(); save(); } });
window.addEventListener('beforeunload', e => { if (docs.some(isDirty)) { e.preventDefault(); e.returnValue = ''; } });

async function exportOne(d) {
  d.status = '导出中…'; draw(); const o = opts(); const t0 = Date.now();
  try {
    const r = await api('/api/pdf', Object.assign({}, d, o));
    if (o.saveTo) { const j = await r.json(); log('已保存 ' + j.saved + ' (' + (j.bytes / 1048576).toFixed(1) + ' MB, ' + ((Date.now() - t0) / 1000).toFixed(1) + ' 秒)'); }
    else {
      const blob = await r.blob(), a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = d.name.replace(/\.md$/i, '') + '.pdf'; a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 60000);
      log('已下载 ' + a.download + ' (' + (blob.size / 1048576).toFixed(1) + ' MB)');
    }
    d.status = '已导出';
  } catch (e) { d.status = '失败'; log(d.name + ' 导出失败: ' + e.message); }
  draw();
}
$('all').onclick = async () => {
  if (!opts().saveTo && docs.length > 3 && !confirm('没有填"保存到"文件夹，会触发 ' + docs.length + ' 次浏览器下载。继续吗？')) return;
  $('all').disabled = true;
  for (let i = 0; i < docs.length; i++) { log('导出 ' + (i + 1) + '/' + docs.length + ': ' + docs[i].name); await exportOne(docs[i]); }
  $('all').disabled = false; log('全部完成: ' + docs.filter(d => d.status === '已导出').length + '/' + docs.length);
};
$('clear').onclick = () => {
  if (docs.some(isDirty) && !confirm('有未保存的修改，清空会丢掉这些修改。继续吗？')) return;
  docs.length = 0; current = null; editorDoc = null; $('work').hidden = true; $('empty').hidden = false; $('problems').style.display = 'none'; $('docbar').style.display = 'none'; draw();
};

// ---- adding files
const isMd = n => /\.(md|markdown)$/i.test(n);
const readFiles = fs => Promise.all([...fs].filter(f => isMd(f.name)).map(f => f.text().then(md => ({ name: f.name, md }))));
$('pickFiles').onclick = () => $('files').click();
$('pickDir').onclick = () => $('dir').click();
$('files').onchange = async e => { add(await readFiles(e.target.files)); e.target.value = ''; };
$('dir').onchange = async e => { const l = await readFiles(e.target.files); l.sort((a, b) => byName(a.name, b.name)); add(l); e.target.value = ''; };
$('loadPath').onclick = async () => {
  const dir = $('dirPath').value.trim(); if (!dir) return;
  try {
    const r = await fetch('/api/list?dir=' + encodeURIComponent(dir)), j = await r.json();
    if (!r.ok) throw new Error(j.error);
    add(j.files); log('载入 ' + j.files.length + ' 个文件: ' + j.dir);
    try { localStorage.setItem('kamo.dirPath', dir); } catch (e) {}
  } catch (e) { log('载入失败: ' + e.message); }
};
try { $('dirPath').value = localStorage.getItem('kamo.dirPath') || ''; } catch (e) {}
$('dirPath').onkeydown = e => { if (e.key === 'Enter') $('loadPath').click(); };

// drag and drop (files and folders)
const drop = $('drop');
drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
drop.ondragleave = () => drop.classList.remove('over');
drop.ondrop = async e => {
  e.preventDefault(); drop.classList.remove('over');
  const entries = [...e.dataTransfer.items].map(i => i.webkitGetAsEntry && i.webkitGetAsEntry()).filter(Boolean), out = [];
  const walk = ent => new Promise(ok => {
    if (ent.isFile) { if (isMd(ent.name)) ent.file(f => f.text().then(md => { out.push({ name: f.name, md }); ok(); }), ok); else ok(); }
    else { const rd = ent.createReader(), all = [];
      const more = () => rd.readEntries(es => es.length ? (all.push(...es), more()) : Promise.all(all.map(walk)).then(ok), ok); more(); }
  });
  await Promise.all(entries.map(walk));
  out.sort((a, b) => byName(a.name, b.name)); add(out);
};
</script>
</body>
</html>
